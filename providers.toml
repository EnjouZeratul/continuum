# Continuum Provider Registry
# Single source of truth for all LLM provider configurations.
# Read by Python SDK, CLI (via Rust), and documentation generators.

[anthropic]
name = "anthropic"
display_name = "Anthropic (Claude)"
api_format = "anthropic"
default_base_url = "https://api.anthropic.com"
env_key = "ANTHROPIC_API_KEY"
default_model = "claude-sonnet-4-6"
default_small_model = "claude-haiku-4-5"
models = [
    "claude-opus-4-8",
    "claude-opus-4-7",
    "claude-opus-4-6",
    "claude-opus-4-5",
    "claude-sonnet-4-6",
    "claude-sonnet-4-5",
    "claude-haiku-4-5",
    "claude-mythos-preview",
]
sdk_support = true
cli_support = true

[openai]
name = "openai"
display_name = "OpenAI (GPT)"
api_format = "openai"
default_base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
default_model = "gpt-5.5"
default_small_model = "gpt-4.1-mini"
models = [
    "gpt-5.5",
    "gpt-5.4",
    "gpt-5.2",
    "gpt-5.1",
    "gpt-5",
    "o3-mini",
    "o1",
    "gpt-4o",
    "gpt-4o-mini",
]
sdk_support = true
cli_support = true

