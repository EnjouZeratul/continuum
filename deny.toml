[advisories]
ignore = [
    # Unmaintained crates (indirect dependencies, still present in tree)
    "RUSTSEC-2024-0436",  # paste - no longer maintained
    "RUSTSEC-2024-0320",  #.enum_primitive - unmaintained
    "RUSTSEC-2024-0014",  # same-file crate - no longer maintained
    "RUSTSEC-2025-0141",  # bincode - unmaintained (advisory renumbered from 2024-0375)

    # wasmtime advisory exceptions were REMOVED on the 25 → 47 upgrade
    # (47.0.3 is in every patched range). Re-add individually with a
    # justification if one fires again — do not accumulate blanket ignores.

    "RUSTSEC-2026-0192",  # ttf-parser unmaintained; transitive of lopdf 0.42
                          # (PDF font parsing, no known exploit; lopdf 0.42 is
                          # required by RUSTSEC-2026-0187 and has no replacement)
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-DFS-2016", "Unicode-3.0", "CC0-1.0", "MPL-2.0"]
private = { ignore = true }

[bans]
multiple-versions = "warn"
