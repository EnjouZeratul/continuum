# Playwright MCP 配置示例
# 展示如何将 Playwright 浏览器自动化集成到 Continuum

model:
  provider: openai
  name: gpt-4-turbo

agent:
  planning_strategy: one_shot
  max_iterations: 20
  hooks:
    - type: permission
      blocked_tools: [run_command]

tools:
  # 内置工具
  builtin:
    - file_ops
    - search

  # MCP 服务器配置
  mcp:
    # Playwright 浏览器自动化
    - name: playwright
      command: npx
      args:
        - "@playwright/mcp@latest"
        - "--headless"          # 无头模式 (生产环境推荐)
        - "--browser"
        - "chrome"             # 可选: chrome, firefox, webkit, msedge
        # - "--caps"
        # - "vision,pdf"        # 可选能力: vision(视觉), pdf(PDF生成), devtools
        # - "--allowed-hosts"
        # - "example.com,trusted-site.com"  # 安全限制: 只允许访问指定域名
        # - "--blocked-origins"
        # - "malware-site.com"              # 安全限制: 阻止特定来源

    # 可选: 文件系统 MCP
    - name: filesystem
      command: mcp-server-filesystem
      args:
        - "--root"
        - "."

memory:
  project: EGG.md

# Playwright 使用示例:
#
# 1. 基础导航
#    - browser_navigate: {"url": "https://example.com"}
