name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
  # 提前切换到 Node.js 24（2026-06-16 后会成为默认）
  # 消除 Node.js 20 deprecation 警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Rust CI
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        # Exclude sh-python (Python bindings) - tested via Python tests
        run: cargo test --workspace --exclude sh-python --verbose

  # Python CI
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install ruff black mypy
      - run: ruff check python/
      - run: black --check python/
      - name: Run MyPy
        run: mypy python/continuum python/continuum_sdk
        continue-on-error: true

  python-test:
    name: Python Tests
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./python[dev]
      - name: Run Python tests
        run: pytest python/tests/ -v --cov=continuum_sdk --cov=continuum --cov-report=term-missing

  # Build binaries
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: [rust-test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Python bindings
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --manifest-path rust/sh-python/Cargo.toml --out dist
          rust-toolchain: stable

      - name: Build CLI
        run: cargo build --release -p continuum --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: target/release/continuum*
          retention-days: 7
        if: runner.os != 'Windows'

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: target/release/continuum.exe
          retention-days: 7
        if: runner.os == 'Windows'

  # Security audit
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny

      - name: Run security audit
        run: cargo deny check

  # Code Coverage
  coverage-rust:
    name: Rust Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Generate coverage
        # Exclude sh-python (Python bindings) - tested via Python tests
        run: cargo llvm-cov --workspace --exclude sh-python --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  coverage-python:
    name: Python Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./python[dev]

      - name: Generate coverage
        run: pytest python/tests/ --cov=continuum_sdk --cov=continuum --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Performance benchmark (Task 2.5) — runs criterion benchmarks and stores
  # results as artifact. Full regression-blocking requires baseline cache +
  # criterion --baseline comparison parsing (listed as follow-up).
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --workspace --exclude sh-python

      - name: Store benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: target/criterion/
          retention-days: 30

      - name: Performance regression check (>20% slower = warn)
        run: |
          # Extract key metrics from criterion output and compare to baseline
          cargo bench --workspace --exclude sh-python 2>&1 | tee bench_output.txt
          echo "=== Benchmark Summary ==="
          grep "time:" bench_output.txt | head -20
          echo "=== Done ==="
        continue-on-error: true

  # Clippy pedantic baseline (Task 4.5) — non-blocking, tracks strictness
  # baseline over time. Full pedantic-clean is a long-term goal (1622 warnings,
  # mostly style noise). High-value subsets (cast truncation, must_use) to be
  # fixed incrementally.
  clippy-pedantic:
    name: Clippy Pedantic (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy pedantic (baseline tracking)
        run: cargo clippy --workspace --exclude sh-python --all-targets -- -W clippy::pedantic 2>&1 | tee pedantic-report.txt

      - name: Count pedantic warnings
        run: |
          echo "Pedantic warnings: $(grep -c '^warning' pedantic-report.txt || echo 0)"
        continue-on-error: true

  # Fuzz testing — Linux only (Windows ASan/libFuzzer unsupported).
  # Non-blocking, 5-min per target. Depends on sh-safety crate (compiles in <15s,
  # no heavy deps like reqwest/tokio/lopdf). Assertion-based (not just no-panic).
  fuzz:
    name: Fuzz Testing (Linux, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Run fuzz_path_safety (5 min)
        run: |
          cd rust/layer3
          cargo +nightly fuzz run fuzz_path_safety -- --max-total-time=300
        continue-on-error: true

      - name: Run fuzz_secret_scrub (5 min)
        run: |
          cd rust/layer3
          cargo +nightly fuzz run fuzz_secret_scrub -- --max-total-time=300
        continue-on-error: true


