[dev-dependencies]
tempfile.workspace = true
continuum = { version = "1.0.0", path = "../../cli" }
sh-layer1 = { version = "1.0.0", path = "../layer1" }
sh-layer2 = { version = "1.0.0", path = "../layer2" }

