[package]
name = "sh-layer4"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Continuum Layer 4: Integration"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sh-layer4"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
sh-layer2.workspace = true
sh-layer3.workspace = true
sh-safety.workspace = true

tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
libloading.workspace = true
wasmtime.workspace = true
wasmtime-wasi = { version = "25", features = ["preview1"] }
abi_stable.workspace = true

# HTTP 客户端
reqwest.workspace = true

# Base64 decoding for wasm_base64 capability installs
base64 = "0.22"

# WebSocket 客户端
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures.workspace = true

[dev-dependencies]
tempfile.workspace = true
# WAT → wasm binary encoding for base64 install tests (also in wasmtime's tree)
wat = "1"
# continuum CLI dev-dependency removed (circular dependency for publishing)
# continuum = { version = "1.0.0", path = "../../cli" }
sh-layer1.workspace = true
sh-layer2.workspace = true

# Integration test disabled due to circular dependency with continuum CLI
# To re-enable: add continuum dev-dependency and uncomment below
# [[test]]
# name = "integration_llm"
# path = "../tests/integration_llm.rs"