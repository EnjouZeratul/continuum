[package]
name = "sh-safety-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.sh-safety]
path = "../../safety"

[[bin]]
name = "fuzz_path_safety"
path = "fuzz_targets/fuzz_path_safety.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_secret_scrub"
path = "fuzz_targets/fuzz_secret_scrub.rs"
test = false
doc = false
bench = false

# Keep fuzz crate out of the main workspace
[workspace]
