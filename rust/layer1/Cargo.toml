[package]
name = "sh-layer1"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Continuum Layer 1: Foundation"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/sh-layer1"
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = []
local-embeddings = []
mock = []
otel = ["opentelemetry", "tracing-opentelemetry", "opentelemetry-otlp"]
prometheus = ["metrics", "metrics-exporter-prometheus"]

[dependencies]
sh-layer0.workspace = true

tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest.workspace = true
sled.workspace = true
config.workspace = true
moka.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
futures.workspace = true
toml.workspace = true
dirs.workspace = true

# WebSocket support
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

# Async stream support
async-stream = "0.3"

# Optional observability dependencies
opentelemetry = { version = "0.27", optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
opentelemetry-otlp = { version = "0.27", optional = true, features = ["grpc-tonic"] }
metrics = { version = "0.24", optional = true }
metrics-exporter-prometheus = { version = "0.15", optional = true }

[dev-dependencies]
tempfile.workspace = true
criterion.workspace = true
dashmap.workspace = true
wiremock.workspace = true

[[bench]]
name = "bench_config"
harness = false

[[bench]]
name = "bench_session"
harness = false

[[bench]]
name = "bench_concurrent"
harness = false
